<!doctype html>
<html><head><meta charset="utf-8"/><title>Toast</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/mova-app/shadcn-components.css">
<link rel="stylesheet" href="_preview-common.css">
</head><body class="preview"><div class="preview-root preview-col" style="gap: 10px; max-width: 420px;">
  <div role="status" class="toast toast--success">
    <span class="toast__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <div class="toast__col">
      <div class="toast__title">Set logged</div>
      <div class="toast__desc">Bench Press · 92.5 kg × 8</div>
    </div>
  </div>
  <div role="status" class="toast toast--error">
    <span class="toast__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg></span>
    <div class="toast__col">
      <div class="toast__title">Couldn't save session</div>
      <div class="toast__desc">Check your connection and try again.</div>
    </div>
    <button class="toast__action">Retry</button>
  </div>
  <div role="status" class="toast toast--info">
    <span class="toast__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
    <div class="toast__col"><div class="toast__title">You're on a 4-day streak — keep it up.</div></div>
  </div>
</div></body></html>
