<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mova — Badges & Chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; font-family: var(--font-sans); background: var(--background); color: var(--foreground); }
  .root { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;}
  .label { width: 80px; font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); text-transform: uppercase; }

  /* Badge: rounded-4xl pill */
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid transparent; white-space: nowrap;}
  .badge.default     { background: var(--destructive); color: var(--primary-foreground);}
  .badge.secondary   { background: var(--secondary); color: var(--secondary-foreground);}
  .badge.outline     { background: transparent; border-color: var(--border); color: var(--foreground);}
  .badge.destructive { background: oklch(0.577 0.245 27.325 / 0.1); color: var(--destructive);}

  /* Muscle-group chip — used on exercise rows */
  .chip { display: inline-flex; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--muted); color: var(--accent-foreground); font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; align-items: center;}

  /* Tag (filter pill) */
  .filter { display: inline-flex; height: 30px; padding: 0 14px; border-radius: 999px; background: var(--muted); color: var(--foreground); font-size: 13px; font-weight: 500; align-items: center; cursor: pointer; }
  .filter.active { background: var(--destructive); color: var(--primary-foreground); }
</style>
</head>
<body>
  <div class="root">
    <div class="row"><div class="label">badge</div>
      <span class="badge default">USER</span>
      <span class="badge secondary">ADMIN</span>
      <span class="badge outline">Compound</span>
      <span class="badge destructive">PENDING</span>
    </div>
    <div class="row"><div class="label">chip</div>
      <span class="chip">QUADS</span>
      <span class="chip">GLUTES</span>
      <span class="chip">CARDIO</span>
      <span class="chip">CHEST</span>
    </div>
    <div class="row"><div class="label">filter</div>
      <span class="filter active">All Muscles</span>
      <span class="filter">Chest</span>
      <span class="filter">Back</span>
      <span class="filter">Legs</span>
      <span class="filter">Core</span>
    </div>
  </div>
</body>
</html>
