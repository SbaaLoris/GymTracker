<!doctype html>
<html><head><meta charset="utf-8"/><title>ToggleGroup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/mova-app/shadcn-components.css">
<link rel="stylesheet" href="_preview-common.css">
</head><body class="preview"><div class="preview-root preview-col" style="gap: 18px;">
  <div>
    <div class="preview-label" style="margin-bottom: 6px">Single — "Date range"</div>
    <div class="toggle-group" role="radiogroup">
      <button class="toggle-group__item" role="radio" data-state="off">1W</button>
      <button class="toggle-group__item" role="radio" data-state="on" aria-checked="true">1M</button>
      <button class="toggle-group__item" role="radio" data-state="off">3M</button>
      <button class="toggle-group__item" role="radio" data-state="off">6M</button>
      <button class="toggle-group__item" role="radio" data-state="off">1Y</button>
      <button class="toggle-group__item" role="radio" data-state="off">All</button>
    </div>
  </div>
  <div>
    <div class="preview-label" style="margin-bottom: 6px">Multiple — "Filter by muscle"</div>
    <div class="toggle-group" role="group">
      <button class="toggle-group__item" role="checkbox" data-state="on" aria-checked="true">Chest</button>
      <button class="toggle-group__item" role="checkbox" data-state="off">Back</button>
      <button class="toggle-group__item" role="checkbox" data-state="on" aria-checked="true">Legs</button>
      <button class="toggle-group__item" role="checkbox" data-state="off">Shoulders</button>
      <button class="toggle-group__item" role="checkbox" data-state="off">Cardio</button>
    </div>
  </div>
</div></body></html>
