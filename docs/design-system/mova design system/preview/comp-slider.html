<!doctype html>
<html><head><meta charset="utf-8"/><title>Slider</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/mova-app/shadcn-components.css">
<link rel="stylesheet" href="_preview-common.css">
</head><body class="preview"><div class="preview-root preview-col" style="gap: 18px;">
  <div class="field" style="max-width: 480px;">
    <label class="field__label">Cardio intensity · <span style="color: var(--muted-foreground)">7 / 10</span></label>
    <div class="slider">
      <div class="slider__track"><div class="slider__range" style="width: 70%"></div></div>
      <div class="slider__thumb" style="left: 70%" role="slider" aria-valuenow="7" tabindex="0"></div>
    </div>
  </div>
  <div class="field" style="max-width: 480px;">
    <label class="field__label">Rest timer · <span style="color: var(--muted-foreground)">2:30</span></label>
    <div class="slider">
      <div class="slider__track"><div class="slider__range" style="width: 50%"></div></div>
      <div class="slider__thumb" style="left: 50%" role="slider" tabindex="0"></div>
    </div>
  </div>
</div></body></html>
