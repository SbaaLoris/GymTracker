<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mova — Colors / Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; font-family: var(--font-sans); background: var(--background); color: var(--foreground); }
  .root { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .row  { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw   { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 70px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }
  .label{ font-size: 11px; font-weight: 500; }
  .meta { font-size: 10px; color: var(--muted-foreground); font-family: var(--font-mono); }
  h2 { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground); font-weight: 500;}
</style>
</head>
<body>
  <div class="root">
    <h2>Neutrals — warm-tinted (slight 107° hue)</h2>
    <div class="row">
      <div class="sw"><div class="chip" style="background: oklch(1 0 0)"></div><div class="label">background</div><div class="meta">#FFFFFF</div></div>
      <div class="sw"><div class="chip" style="background: oklch(0.988 0.003 106.5)"></div><div class="label">sidebar</div><div class="meta">L 0.988</div></div>
      <div class="sw"><div class="chip" style="background: oklch(0.966 0.005 106.5)"></div><div class="label">muted / accent</div><div class="meta">L 0.966</div></div>
      <div class="sw"><div class="chip" style="background: oklch(0.93 0.007 106.5)"></div><div class="label">border / input</div><div class="meta">L 0.930</div></div>
      <div class="sw"><div class="chip" style="background: oklch(0.58 0.031 107.3)"></div><div class="label">muted-fg</div><div class="meta">L 0.580</div></div>
      <div class="sw"><div class="chip" style="background: oklch(0.153 0.006 107.1)"></div><div class="label">foreground</div><div class="meta">L 0.153</div></div>
    </div>
  </div>
</body>
</html>
