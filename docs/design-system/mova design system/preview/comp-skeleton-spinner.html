<!doctype html>
<html><head><meta charset="utf-8"/><title>Skeleton · Spinner</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/mova-app/shadcn-components.css">
<link rel="stylesheet" href="_preview-common.css">
</head><body class="preview"><div class="preview-root" style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px;">
  <div>
    <div class="preview-label" style="margin-bottom: 8px">Skeleton — card placeholder</div>
    <div class="card" style="padding-bottom: 1rem;">
      <div class="card-header">
        <div class="skeleton" style="width: 60%; height: 16px;"></div>
        <div class="skeleton" style="width: 40%; height: 12px;"></div>
      </div>
      <div class="card-content">
        <div class="skeleton" style="width: 100%; height: 80px;"></div>
      </div>
    </div>
  </div>
  <div>
    <div class="preview-label" style="margin-bottom: 8px">Spinner — button + inline</div>
    <div class="preview-col" style="gap: 12px;">
      <button class="btn btn--default" disabled>
        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" data-icon="inline-start"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Logging in…
      </button>
      <div style="display: flex; gap: 8px; align-items: center;">
        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--primary)"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <span style="font-size: 13px; color: var(--muted-foreground)">Loading session…</span>
      </div>
    </div>
  </div>
</div></body></html>
