<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mova — Stat Card (shadcn dashboard pattern)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    background: oklch(0.988 0.003 106.5);
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
  }
  .root {
    padding: 22px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  /* shadcn Card — direct port of frontend/src/components/ui/card.tsx + ui.shadcn.com dashboard pattern */
  .card {
    background: var(--card);
    color: var(--card-foreground);
    border-radius: 12px;                                  /* rounded-xl */
    box-shadow: 0 0 0 1px oklch(0.153 0.006 107.1 / 0.10);/* ring-1 ring-foreground/10 */
    display: flex; flex-direction: column;
    gap: 1.5rem;                                          /* gap-6 in stat cards */
    padding: 1.5rem 0;                                    /* py-6 */
    overflow: hidden;
  }
  /* CardHeader — grid with description above title, action top-right */
  .card-header {
    display: grid;
    grid-template-columns: 1fr auto;                      /* has-data-[slot=card-action]:grid-cols-[1fr_auto] */
    grid-auto-rows: min-content;
    gap: 0.375rem;                                        /* gap-1.5 */
    padding: 0 1.5rem;                                    /* px-6 */
  }
  .card-description {
    grid-column: 1 / 2;
    font-size: 0.875rem;                                  /* text-sm */
    color: var(--muted-foreground);
    line-height: 1.5;
  }
  .card-title {
    grid-column: 1 / 2;
    font-family: var(--font-heading);
    font-size: 1.875rem;                                  /* text-3xl */
    font-weight: 600;                                     /* font-semibold */
    line-height: 1;                                       /* leading-none */
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .card-action {
    grid-column: 2 / 3;
    grid-row: 1 / 3;                                      /* span both rows */
    align-self: start;
    justify-self: end;
  }
  /* CardFooter — micro-meta + supporting line */
  .card-footer {
    display: flex; flex-direction: column;
    gap: 0.125rem;
    padding: 0 1.5rem;
    font-size: 0.875rem;
  }
  .card-footer__primary {
    display: inline-flex; align-items: center; gap: 0.375rem;
    font-weight: 500;
    line-height: 1.4;
  }
  .card-footer__primary svg { width: 14px; height: 14px; color: var(--foreground); }
  .card-footer__secondary {
    color: var(--muted-foreground);
    line-height: 1.4;
  }

  /* Badge — variant="outline" with trend chevron */
  .badge-outline {
    display: inline-flex; align-items: center; gap: 0.25rem;
    height: 1.5rem;                                       /* h-6 — slightly larger for stat-card action */
    padding: 0 0.5rem;
    border-radius: 9999px;                                /* rounded-full */
    border: 1px solid var(--border);
    background: transparent;
    color: var(--foreground);
    font-size: 0.75rem;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-outline svg { width: 12px; height: 12px; }
  .badge-outline--positive { color: var(--foreground); }
  .badge-outline--negative { color: var(--destructive); border-color: oklch(0.577 0.245 27.325 / 0.3); }
</style>
</head>
<body>
  <div class="root">

    <!-- 1. Positive trend — "Total Workouts" -->
    <div class="card">
      <div class="card-header">
        <div class="card-description">Total Workouts</div>
        <div class="card-title">128</div>
        <div class="card-action">
          <span class="badge-outline badge-outline--positive">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
            +12%
          </span>
        </div>
      </div>
      <div class="card-footer">
        <div class="card-footer__primary">
          Trending up this month
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        </div>
        <div class="card-footer__secondary">Sessions completed in October</div>
      </div>
    </div>

    <!-- 2. Negative / weight-loss — destructive accent on badge -->
    <div class="card">
      <div class="card-header">
        <div class="card-description">Current Weight</div>
        <div class="card-title">78.4 <span style="font-size: 0.875rem; color: var(--muted-foreground); font-weight: 500; letter-spacing: 0;">kg</span></div>
        <div class="card-action">
          <span class="badge-outline badge-outline--negative">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
            −2.4kg
          </span>
        </div>
      </div>
      <div class="card-footer">
        <div class="card-footer__primary">
          Down 2.4kg this month
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
        </div>
        <div class="card-footer__secondary">On track for 78 kg goal</div>
      </div>
    </div>

  </div>
</body>
</html>
