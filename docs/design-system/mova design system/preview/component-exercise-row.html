<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mova — Exercise Row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; font-family: var(--font-sans); background: oklch(0.988 0.003 106.5); color: var(--foreground);}
  .root { padding: 22px 24px; }
  .row { background: var(--card); border-radius: 12px; box-shadow: var(--ring-card); padding: 14px 16px; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;}
  .thumb { width: 44px; height: 44px; border-radius: 8px; background: linear-gradient(135deg, oklch(0.3 0.04 30), oklch(0.18 0.02 30)); display: flex; align-items: center; justify-content: center; color: var(--destructive);}
  .info  { display: flex; flex-direction: column; gap: 4px;}
  .name  { font-size: 15px; font-weight: 600;}
  .chips { display: flex; gap: 6px;}
  .chip  { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; background: var(--muted); padding: 2px 8px; border-radius: 6px; color: var(--accent-foreground);}
  .more  { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted-foreground);}
</style>
</head>
<body>
  <div class="root">
    <div class="row">
      <div class="thumb">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
      </div>
      <div class="info">
        <div class="name">Barbell Back Squat</div>
        <div class="chips"><span class="chip">QUADS</span><span class="chip">GLUTES</span></div>
      </div>
      <div class="more">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      </div>
    </div>
  </div>
</body>
</html>
