<!doctype html>
<html><head><meta charset="utf-8"/><title>Accordion</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/mova-app/shadcn-components.css">
<link rel="stylesheet" href="_preview-common.css">
</head><body class="preview"><div class="preview-root">
  <div class="accordion" style="max-width: 640px;">
    <div class="accordion-item">
      <button class="accordion-trigger" data-state="open" aria-expanded="true"><span class="accordion-trigger__label">Barbell Back Squat — 4 × 8 @ 90kg</span><svg class="accordion-trigger__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="accordion-content" data-state="open"><div class="accordion-content__inner">Stand tall under the bar, brace, and descend until thighs are parallel. Drive through midfoot. Rest 2:30 between sets.</div></div>
    </div>
    <div class="accordion-item">
      <button class="accordion-trigger" data-state="closed" aria-expanded="false"><span class="accordion-trigger__label">Romanian Deadlift — 3 × 10 @ 70kg</span><svg class="accordion-trigger__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <div class="accordion-item">
      <button class="accordion-trigger" data-state="closed" aria-expanded="false"><span class="accordion-trigger__label">Walking Lunge — 3 × 12 each leg</span><svg class="accordion-trigger__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </div>
</div></body></html>
