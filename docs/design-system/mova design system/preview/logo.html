<style>
  html, body { margin: 0; padding: 0; font-family: var(--font-sans); background: var(--background); color: var(--foreground);}
  .root { padding: 28px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch;}
  .lockup { padding: 18px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 110px; justify-content: center; align-items: flex-start; box-shadow: var(--ring-card);}
  .light  { background: oklch(1 0 0); }
  .dark   { background: oklch(0.153 0.006 107.1); color: oklch(0.988 0.003 106.5);}
  .red    { background: var(--destructive); color: white; }
  .muted  { background: oklch(0.988 0.003 106.5);}
  .meta   { font-size: 10px; color: currentColor; opacity: 0.6; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em;}
  .logo   { height: 32px; width: auto; display: block; color: currentColor; }
  /* On dark / red lockups the dot stays its brand red so it remains the signature mark */
  .dot-keep { --mova-dot: #E13636; }
  .dot-black { --mova-dot: oklch(0.153 0.006 107.1); }
</style>
