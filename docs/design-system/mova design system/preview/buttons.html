<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mova — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; font-family: var(--font-sans); background: var(--background); color: var(--foreground); }
  .root { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em;}

  /* Buttons — recreating shadcn variants used in the app */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid transparent; cursor: pointer; transition: all 120ms ease; white-space: nowrap; }
  .btn:active:not([aria-haspopup]) { transform: translateY(1px); }

  .btn.primary    { background: var(--destructive); color: var(--primary-foreground); }
  .btn.primary:hover { filter: brightness(0.92);}
  .btn.outline    { background: var(--background); color: var(--foreground); border-color: var(--border);}
  .btn.outline:hover { background: var(--muted);}
  .btn.ghost      { background: transparent; color: var(--foreground);}
  .btn.ghost:hover{ background: var(--muted);}
  .btn.destructive{ background: oklch(0.577 0.245 27.325 / 0.1); color: var(--destructive);}
  .btn.destructive:hover{ background: oklch(0.577 0.245 27.325 / 0.2);}
  .btn.lg { height: 38px; padding: 0 16px; font-size: 14px;}
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px;}
  .btn .ico { width: 14px; height: 14px;}
</style>
</head>
<body>
  <div class="root">
    <div class="row">
      <button class="btn primary">+ Log New Workout</button>
      <button class="btn primary lg">Finish Session ✓</button>
      <button class="btn primary sm">New Entry</button>
    </div>
    <div class="row">
      <button class="btn outline">Last 30 Days</button>
      <button class="btn outline">Export as CSV</button>
      <button class="btn ghost">View Status</button>
      <button class="btn destructive">Logout</button>
    </div>
    <div class="row">
      <div class="label">disabled</div>
      <button class="btn primary" disabled style="opacity:0.5; pointer-events:none;">Logging in…</button>
      <div class="label">focus</div>
      <button class="btn primary" style="box-shadow: 0 0 0 3px oklch(0.577 0.245 27.325 / 0.3);">Login</button>
    </div>
  </div>
</body>
</html>
