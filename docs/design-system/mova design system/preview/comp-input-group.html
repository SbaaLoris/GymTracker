<!doctype html>
<html><head><meta charset="utf-8"/><title>Input Group</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/mova-app/shadcn-components.css">
<link rel="stylesheet" href="_preview-common.css">
</head><body class="preview"><div class="preview-root">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 600px;">
    <div class="field">
      <label class="field__label">Search exercises</label>
      <div class="input-group">
        <div class="input-group__addon" data-align="inline-start">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <input class="input-group__input" placeholder="Squat, deadlift, …" value="back squat"/>
      </div>
    </div>
    <div class="field">
      <label class="field__label">Working weight</label>
      <div class="input-group">
        <input class="input-group__input" type="number" value="142.5"/>
        <div class="input-group__addon" data-align="inline-end">kg</div>
      </div>
    </div>
    <div class="field" style="grid-column: span 2">
      <label class="field__label">Username (with @ prefix)</label>
      <div class="input-group">
        <div class="input-group__addon" data-align="inline-start">@</div>
        <input class="input-group__input" value="loris.sbaa"/>
        <div class="input-group__addon" data-align="inline-end">.mova.app</div>
      </div>
    </div>
  </div>
</div></body></html>
